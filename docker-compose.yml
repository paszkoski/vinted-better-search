services:
  vinted-better-search:
    build: .
    container_name: vinted-better-search
    working_dir: /app
    # No source bind mount — the image's `COPY . .` (Dockerfile) already has
    # the full repo, .git included, so /api/update's `git pull` works against
    # the container's own filesystem. A relative `.:/app` bind mount doesn't
    # reliably resolve to the actual repo checkout under every Portainer
    # stack deploy method (e.g. git-repository stacks), and silently shadows
    # the baked-in code with an empty directory when it doesn't.
    # NET_ADMIN + NET_RAW + SYS_ADMIN, and separately network_mode: host,
    # all failed to let NordVPN write net.ipv6.conf.all.disable_ipv6 — turns
    # out this isn't a capability or network-namespace issue at all. Docker
    # read-only-masks certain /proc/sys paths via its *mount* namespace,
    # independent of network namespace or granted capabilities (confirmed
    # against https://github.com/docker/for-linux/issues/197). systempaths=
    # unconfined removes just that masking — narrower than `privileged`,
    # doesn't touch capabilities/seccomp/AppArmor, no networking tradeoffs.
    security_opt:
      - systempaths=unconfined
    cap_add:
      - NET_ADMIN               # required for NordVPN to manage the tunnel interface
      - NET_RAW                  # required alongside NET_ADMIN for NordVPN's nftables/routing setup
      - SYS_ADMIN                 # some sysctl writes still need this on top of the unmasked path
    devices:
      - /dev/net/tun             # required for NordVPN's tunnel device
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1  # required by NordVPN's Linux client
      net.ipv6.conf.all.disable_ipv6: 0     # initial value; NordVPN toggles it on connect/disconnect
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    environment:
      - PYTHONUNBUFFERED=1     # without this, scraper.py's block/retry diagnostics never reach `docker logs`
      - VINTED_BASE_URL        # e.g. https://www.vinted.de (optional, defaults to vinted.pl)
      - PORT                   # web port inside container (optional, default 5000)
      - BLOCK_WAIT_SECONDS     # fallback cooldown if a VPN rotation itself fails (optional, default 1800 = 30 min)
      - MIN_API_DELAY          # minimum seconds between catalog search requests (optional, default 1.5)
      - DETAIL_CONCURRENCY     # parallel item-description fetches (optional, default 5)
      - DETAIL_JITTER_SECONDS  # random jitter before each description fetch (optional, default 0.3)
      - DETAIL_MIN_GAP_SECONDS # minimum spacing between description-fetch dispatches (optional, default 0.5)
      - DETAIL_BATCH_SIZE      # requests per batch before pausing (optional, default 29)
      - DETAIL_BATCH_COOLDOWN_SECONDS # pause between batches (optional, default 10)
      - DETAIL_MAX_ROUNDS      # retry rounds for deferred/blocked items before giving up (optional, default 5)
      - NORDVPN_TOKEN          # NordVPN login token (required — see .env.example for how to generate one)
      - NORDVPN_COUNTRIES      # comma-separated countries to rotate between (optional, defaults to Poland,Germany,Netherlands,Czech Republic)
      - VPN_ROTATE_COOLDOWN_SECONDS  # minimum seconds between two VPN rotations (optional, default 15)
      - VPN_MAX_ROTATE_ATTEMPTS # max server hops per blocked request before falling back to BLOCK_WAIT_SECONDS (optional, default 15)
      - GITHUB_TOKEN           # PAT with read-only access to this repo, for the update button (required — repo is private)
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.environ.get('PORT', '5000') + '/health', timeout=5)\""
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s        # give nordvpnd + login time to finish on first start
