services:
  vinted-better-search:
    image: python:3.11-slim
    container_name: vinted-better-search
    working_dir: /app
    volumes:
      - .:/app                 # source code (rw — auto-update runs `git pull` here)
    command: >
      sh -c "command -v git >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends git) &&
             pip install -r requirements.txt -q --no-cache-dir &&
             python -u app.py"
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PYTHONUNBUFFERED=1     # without this, scraper.py's block/retry diagnostics never reach `docker logs`
      - VINTED_BASE_URL        # e.g. https://www.vinted.de (optional, defaults to vinted.pl)
      - PORT                   # web port inside container (optional, default 5000)
      - BLOCK_WAIT_SECONDS     # seconds to pause after a 403 block (optional, default 1800 = 30 min)
      - MIN_API_DELAY          # minimum seconds between catalog search requests (optional, default 1.5)
      - DETAIL_CONCURRENCY     # parallel item-description fetches (optional, default 5)
      - DETAIL_JITTER_SECONDS  # random jitter before each description fetch (optional, default 0.3)
      - VINTED_PROXY           # proxy in host:port format, e.g. 1.2.3.4:8080 (optional)
      - GITHUB_TOKEN           # PAT with read-only access to this repo, for the update button (required — repo is private)
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s        # give pip install time to finish on first start
